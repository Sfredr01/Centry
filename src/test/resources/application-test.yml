# Hermetic test overrides: a unique SQLite file per Spring context under java.io.tmpdir,
# nothing written to ./data. No :memory:, because pooled connections would each get their own database.
spring:
  datasource:
    url: jdbc:sqlite:${java.io.tmpdir}/centry-test-${random.uuid}.db

centry:
  notify:
    # Tests call AlertRetrySweeper.sweep() themselves; a background sweep would race their assertions.
    retry-enabled: false
  # Bootstrap admin for tests (>= 12 chars). Every test context starts with an empty database, so this user exists.
  admin:
    password: test-admin-password
