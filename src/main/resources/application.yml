server:
  port: 8080

spring:
  application:
    name: centry

  datasource:
    # SqliteDataDirectoryPostProcessor creates the directory; Docker sets CENTRY_DATA_DIR=/data.
    url: jdbc:sqlite:${CENTRY_DATA_DIR:./data}/centry.db
    hikari:
      # SQLite allows one writer; a single connection avoids SQLITE_BUSY between pool members.
      maximum-pool-size: 1
      # Passed to the sqlite-jdbc driver as connection properties (applied to every connection).
      data-source-properties:
        journal_mode: WAL
        busy_timeout: 5000
        foreign_keys: true

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  endpoint:
    health:
      show-details: always

---
# Kafka is opt-in: without the "kafka" profile its auto-configuration is excluded,
# so the app starts with no Kafka beans and never contacts a broker.
spring:
  config:
    activate:
      on-profile: "!kafka"
  autoconfigure:
    exclude:
      - org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration
      - org.springframework.boot.kafka.autoconfigure.metrics.KafkaMetricsAutoConfiguration
