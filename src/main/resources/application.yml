server:
  port: 8080

spring:
  application:
    name: centry

  datasource:
    url: jdbc:h2:file:./data/centrydb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  endpoint:
    health:
      show-details: always

---
# Kafka is opt-in: without the "kafka" profile its auto-configuration is excluded,
# so the app starts with no Kafka beans and never contacts a broker.
spring:
  config:
    activate:
      on-profile: "!kafka"
  autoconfigure:
    exclude:
      - org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration
      - org.springframework.boot.kafka.autoconfigure.metrics.KafkaMetricsAutoConfiguration
