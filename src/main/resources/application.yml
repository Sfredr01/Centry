server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        # Secure is off by default because plain-HTTP LAN use is common. Behind HTTPS (Tailscale, Caddy) set
        # SERVER_SERVLET_SESSION_COOKIE_SECURE=true. The first admin comes from CENTRY_ADMIN_PASSWORD
        # (centry.admin.password, at least 12 characters); CENTRY_ADMIN_USERNAME is optional (default admin).

spring:
  application:
    name: centry

  datasource:
    # SqliteDataDirectoryPostProcessor creates the directory; Docker sets CENTRY_DATA_DIR=/data.
    url: jdbc:sqlite:${CENTRY_DATA_DIR:./data}/centry.db
    hikari:
      # SQLite allows one writer; a single connection avoids SQLITE_BUSY between pool members.
      maximum-pool-size: 1
      # Passed to the sqlite-jdbc driver as connection properties (applied to every connection).
      data-source-properties:
        journal_mode: WAL
        busy_timeout: 5000
        foreign_keys: true

# Only the public liveness probe is exposed; everything else (metrics, prometheus, info) is off.
management:
  endpoints:
    web:
      exposure:
        include: "health"
  endpoint:
    health:
      show-details: never
      # Probe groups would add a "groups" array to /actuator/health; the Docker healthcheck only needs the status.
      probes:
        enabled: false

---
# Kafka is opt-in: without the "kafka" profile its auto-configuration is excluded,
# so the app starts with no Kafka beans and never contacts a broker.
spring:
  config:
    activate:
      on-profile: "!kafka"
  autoconfigure:
    exclude:
      - org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration
      - org.springframework.boot.kafka.autoconfigure.metrics.KafkaMetricsAutoConfiguration
