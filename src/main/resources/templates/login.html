<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page('Sign in', ~{::main})}">
<body>
<main class="container">
    <h1>Centry</h1>
    <th:block th:if="${param.error}">
        <div th:replace="~{fragments/components :: notice('error', 'Wrong username or password.')}"></div>
    </th:block>
    <th:block th:if="${param.logout}">
        <div th:replace="~{fragments/components :: notice('success', 'You have been signed out.')}"></div>
    </th:block>
    <form method="post" th:action="@{/login}">
        <label>Username
            <input name="username" autocomplete="username" autocapitalize="none" required autofocus>
        </label>
        <label>Password
            <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <label>
            <input name="remember-me" type="checkbox">
            Remember me for 30 days
        </label>
        <button type="submit">Sign in</button>
    </form>
</main>
</body>
</html>
