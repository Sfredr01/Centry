<!DOCTYPE html>
<!--/* Shared page shell. A page replaces its own <html> with page(title, ~{::main}). */-->
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="page(title, content)">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#2f5d3a">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121812">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <!--/* htmx ignores 4xx by default; a 422 carries the form with its inline errors, so swap it. */-->
    <meta name="htmx-config"
          content='{"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"422","swap":true},{"code":"[45]..","swap":false,"error":true}]}'>
    <title th:text="|${title} - Centry|">Centry</title>
    <link rel="manifest" th:href="@{/manifest.webmanifest}">
    <link rel="icon" type="image/svg+xml" th:href="@{/icons/icon.svg}">
    <link rel="apple-touch-icon" th:href="@{/icons/icon-192.png}">
    <!--/* Both faces render above the fold; crossorigin is required for font preloads even on the same host. */-->
    <link rel="preload" th:href="@{/vendor/fonts/source-sans-3-latin-wght-normal.woff2}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" th:href="@{/vendor/fonts/fraunces-latin-wght-normal.woff2}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" th:href="@{/vendor/pico.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/vendor/htmx.min.js}" defer></script>
</head>
<body th:attr='hx-headers=|{"${_csrf.headerName}":"${_csrf.token}"}|'>
<header class="container appbar" sec:authorize="isAuthenticated()">
    <a class="brand" th:href="@{/}"><img th:src="@{/icons/icon.svg}" src="/icons/icon.svg" alt="" width="28" height="28">Centry</a>
    <form method="post" th:action="@{/logout}" class="signed-in">
        <span sec:authentication="name">user</span>
        <button type="submit" class="outline secondary">Log out</button>
    </form>
</header>
<th:block th:insert="${content}"></th:block>
<!--/* Bottom navigation where thumbs reach. The page title says which tab is current. */-->
<nav class="tabbar" aria-label="Main" sec:authorize="isAuthenticated()">
    <a th:href="@{/}" th:attr="aria-current=${title == 'Dashboard'} ? 'page'">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13h4v8H3zM10 3h4v18h-4zM17 9h4v12h-4z"/></svg>Dashboard</a>
    <a th:href="@{/add}" class="add" aria-label="Add expense" th:attr="aria-current=${title == 'Add expense'} ? 'page'">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a>
    <a th:href="@{/budgets}" th:attr="aria-current=${title == 'Budgets'} ? 'page'">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>Budgets</a>
</nav>
</body>
</html>
