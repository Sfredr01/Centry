<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page('Dashboard', ~{::main})}">
<body>
<main class="container">
    <h1 th:text="${#temporals.format(month, 'MMMM yyyy')}">March 2026</h1>

    <th:block th:if="${message}">
        <div th:replace="~{fragments/components :: notice('success', ${message})}"></div>
    </th:block>

    <nav id="member-filter" aria-label="Show spending of">
        <ul class="chips">
            <li><a th:href="@{/}" th:attr="aria-current=${selected == null} ? 'true'">Everyone</a></li>
            <li th:each="m : ${members}">
                <a th:href="@{/(member=${m.id})}" th:text="${m.displayName}"
                   th:attr="aria-current=${m.id == selected} ? 'true'">Member</a>
            </li>
        </ul>
    </nav>

    <!--/* The one number to read first. */-->
    <section id="month-summary" class="summary">
        <span class="overline" th:text="|Spent in ${#temporals.format(month, 'MMMM')}|">Spent in March</span>
        <span class="amount" th:text="${@money.format(spentTotal)}">$97.50</span>
        <span class="muted" th:unless="${budgets.empty}" th:text="|of ${@money.format(budgetedTotal)} budgeted|">of $150.00 budgeted</span>
    </section>

    <section th:if="${!budgets.empty}" id="budget-bars">
        <article th:each="b : ${budgets}" class="budget-bar card" th:attr="data-level=${b.level}">
            <th:block th:replace="~{fragments/components :: budgetBar(${b})}"></th:block>
        </article>
    </section>

    <th:block th:if="${recent.empty}">
        <section th:replace="~{fragments/components :: emptyState('empty-state', 'No expenses yet', 'Add what you spend as it happens and Centry keeps the tally for the month.', @{/add}, 'Add your first expense')}"></section>
    </th:block>

    <section th:unless="${recent.empty}">
        <h2>Recent expenses</h2>
        <!--/* Rows, not a table: merchant and amount get the phone's full width. */-->
        <ul id="recent-expenses" class="expense-list">
            <th:block th:each="r : ${recent}">
                <li th:replace="~{fragments/components :: expenseRow(${r})}"></li>
            </th:block>
        </ul>
    </section>
</main>
</body>
</html>
