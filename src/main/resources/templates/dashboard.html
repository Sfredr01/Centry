<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page('Dashboard', ~{::main})}">
<body>
<main class="container">
    <h1 th:text="${#temporals.format(month, 'MMMM yyyy')}">March 2026</h1>

    <nav id="member-filter" aria-label="Show spending of">
        <ul>
            <li><a th:href="@{/}" th:attr="aria-current=${selected == null} ? 'true'">Everyone</a></li>
            <li th:each="m : ${members}">
                <a th:href="@{/(member=${m.id})}" th:text="${m.displayName}"
                   th:attr="aria-current=${m.id == selected} ? 'true'">Member</a>
            </li>
        </ul>
    </nav>

    <section th:if="${!budgets.empty}" id="budget-bars">
        <article th:each="b : ${budgets}">
            <label>
                <strong th:text="${b.category}">food</strong>
                <span class="muted" th:text="|${b.spent} / ${b.monthlyLimit}|">85.00 / 100.00</span>
                <progress th:value="${b.spent}" th:max="${b.monthlyLimit}" th:attr="data-level=${b.level}"></progress>
            </label>
        </article>
    </section>

    <section th:if="${recent.empty}" id="empty-state">
        <p>No expenses yet.</p>
        <a role="button" th:href="@{/add}">Add your first expense</a>
    </section>

    <section th:unless="${recent.empty}">
        <h2>Recent expenses</h2>
        <div class="overflow-auto">
            <table id="recent-expenses">
                <thead>
                <tr><th>Date</th><th>Merchant</th><th>Category</th><th>Amount</th></tr>
                </thead>
                <tbody>
                <tr th:each="r : ${recent}">
                    <td th:text="${#temporals.format(r.expense.timestamp, 'yyyy-MM-dd')}">2026-03-15</td>
                    <td>
                        <span th:text="${r.expense.merchant}">Market</span>
                        <small class="muted" th:if="${r.spender}" th:text="${r.spender}">Mom</small>
                    </td>
                    <td th:text="${r.expense.category}">food</td>
                    <td th:text="${r.expense.amount}">12.00</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
