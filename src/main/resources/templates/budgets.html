<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: page('Budgets', ~{::main})}">
<body>
<main class="container">
    <h1>Budgets</h1>
    <p role="alert" th:if="${error}" th:text="${error}">Something is wrong.</p>

    <p th:if="${budgets.empty}">No budgets yet.</p>
    <!-- One card per budget: a table with inline inputs does not fit a phone screen. -->
    <section id="budgets" th:unless="${budgets.empty}">
        <article th:each="b : ${budgets}" class="budget">
            <header>
                <strong th:text="${b.category}">food</strong>
                <span th:switch="${b.level.name()}">
                    <span th:case="'OK'">OK</span>
                    <span th:case="'WARNING_EXCEEDED'" data-level="WARNING_EXCEEDED">Warning</span>
                    <span th:case="*" data-level="LIMIT_EXCEEDED">Over limit</span>
                </span>
            </header>
            <p>Spent <span th:text="${@money.format(b.spent)}">$85.00</span>
                <span sec:authorize="!hasRole('ADMIN')">of <span th:text="${@money.format(b.monthlyLimit)}">$100.00</span>,
                    warning at <span th:text="${b.warnPercent}">80</span>%</span></p>
            <div sec:authorize="hasRole('ADMIN')">
                <form method="post" th:action="@{/budgets/{c}(c=${b.category})}">
                    <div class="grid">
                        <label>Monthly limit
                            <input name="monthlyLimit" inputmode="decimal" required th:value="${b.monthlyLimit}">
                        </label>
                        <label>Warn at %
                            <input name="warnPercent" inputmode="numeric" th:value="${b.warnPercent}">
                        </label>
                    </div>
                    <button type="submit">Save</button>
                </form>
                <form method="post" th:action="@{/budgets/{c}/delete(c=${b.category})}">
                    <button type="submit" class="outline secondary">Delete</button>
                </form>
            </div>
        </article>
    </section>

    <form method="post" th:action="@{/budgets}" sec:authorize="hasRole('ADMIN')">
        <h2>Add budget</h2>
        <label>Category <input name="category" autocomplete="off" required></label>
        <label>Monthly limit <input name="monthlyLimit" inputmode="decimal" required></label>
        <label>Warn at percent (default 80) <input name="warnPercent" inputmode="numeric"></label>
        <button type="submit">Add budget</button>
    </form>
</main>
</body>
</html>
