<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: page('Budgets', ~{::main})}">
<body>
<main class="container">
    <h1>Budgets</h1>
    <p role="alert" th:if="${error}" th:text="${error}">Something is wrong.</p>

    <p th:if="${budgets.empty}">No budgets yet.</p>
    <div class="overflow-auto" th:unless="${budgets.empty}">
        <table id="budgets">
            <thead>
            <tr>
                <th>Category</th><th>Spent</th><th>Limit</th><th>Warn %</th><th>Status</th>
                <th sec:authorize="hasRole('ADMIN')"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="b, row : ${budgets}">
                <td th:text="${b.category}">food</td>
                <td th:text="${b.spent}">85.00</td>
                <td>
                    <span sec:authorize="!hasRole('ADMIN')" th:text="${b.monthlyLimit}">100.00</span>
                    <input sec:authorize="hasRole('ADMIN')" name="monthlyLimit" inputmode="decimal" required
                           th:form="|edit-${row.index}|" th:value="${b.monthlyLimit}" aria-label="Monthly limit">
                </td>
                <td>
                    <span sec:authorize="!hasRole('ADMIN')" th:text="${b.warnPercent}">80</span>
                    <input sec:authorize="hasRole('ADMIN')" name="warnPercent" inputmode="numeric"
                           th:form="|edit-${row.index}|" th:value="${b.warnPercent}" aria-label="Warn at percent">
                </td>
                <td th:switch="${b.level.name()}">
                    <span th:case="'OK'">OK</span>
                    <span th:case="'WARNING_EXCEEDED'" data-level="WARNING_EXCEEDED">Warning</span>
                    <span th:case="*" data-level="LIMIT_EXCEEDED">Over limit</span>
                </td>
                <td sec:authorize="hasRole('ADMIN')">
                    <form method="post" th:id="|edit-${row.index}|" th:action="@{/budgets/{c}(c=${b.category})}">
                        <button type="submit">Save</button>
                    </form>
                    <form method="post" th:action="@{/budgets/{c}/delete(c=${b.category})}">
                        <button type="submit" class="outline secondary">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <form method="post" th:action="@{/budgets}" sec:authorize="hasRole('ADMIN')">
        <h2>Add budget</h2>
        <label>Category <input name="category" autocomplete="off" required></label>
        <label>Monthly limit <input name="monthlyLimit" inputmode="decimal" required></label>
        <label>Warn at percent (default 80) <input name="warnPercent" inputmode="numeric"></label>
        <button type="submit">Add budget</button>
    </form>
</main>
</body>
</html>
