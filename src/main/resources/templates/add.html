<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page('Add expense', ~{::main})}">
<body>
<main class="container">
    <h1>Add expense</h1>
    <!--/* The panel is also the htmx response: it replaces itself with a message and a fresh form. */-->
    <div id="add-panel" th:fragment="panel">
        <p role="status" th:if="${message}" th:text="${message}">Saved.</p>
        <form method="post" th:action="@{/add}" th:attr="hx-post=@{/add}" hx-target="#add-panel" hx-swap="outerHTML"
              hx-disabled-elt="find button">
            <th:block th:replace="~{fragments/expense-fields :: fields}"></th:block>
            <input type="hidden" name="clientRef" th:value="${form.clientRef}">
            <button type="submit">Save</button>
        </form>
    </div>
</main>
</body>
</html>
