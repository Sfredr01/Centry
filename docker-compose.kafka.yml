# Optional Kafka override. Use:
#   docker compose -f docker-compose.yml -f docker-compose.kafka.yml up -d
# Before the first start the broker's data dir must be writable by the broker user (uid 1000):
#   sudo mkdir -p /opt/centry/data/kafka && sudo chown -R 1000:1000 /opt/centry/data/kafka
# Kafka is reachable from the host only on 127.0.0.1:9092 and advertises itself as kafka:9092, so host-side
# clients need a "127.0.0.1 kafka" hosts entry. Log retention bytes apply per partition.
services:
  kafka:
    image: confluentinc/cp-kafka:7.4.1
    container_name: centry-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 268435456
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - ${CENTRY_DATA:-/opt/centry/data}/kafka:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "bash", "-c", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  app:
    environment:
      SPRING_PROFILES_ACTIVE: kafka
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
