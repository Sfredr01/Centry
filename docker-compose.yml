# The default Centry stack: the app only. Copy .env.example to .env and set CENTRY_TAG and CENTRY_ADMIN_PASSWORD.
# Optional Kafka: docker compose -f docker-compose.yml -f docker-compose.kafka.yml up -d
services:
  app:
    image: ${CENTRY_IMAGE:-ghcr.io/sfredr01/centry}:${CENTRY_TAG:?set CENTRY_TAG in .env}
    container_name: centry
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - "${CENTRY_PORT:-8080}:8080"
    volumes:
      # Must be owned by 10001:10001 (the container user).
      - ${CENTRY_DATA:-/opt/centry/data}:/data
    deploy:
      resources:
        limits:
          memory: 400M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
