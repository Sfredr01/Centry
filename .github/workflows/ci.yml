name: CI

on:
  pull_request:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    name: Test and coverage gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      # check = tests + JaCoCo 100% line/branch verification
      - name: Run tests with coverage gate
        run: ./gradlew check

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html

  docker:
    name: Docker image builds
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh

      # Native amd64 build proves the Dockerfile works without slow QEMU emulation. It is loaded into the local
      # Docker daemon as centry:smoke, which smoke.sh and test-upgrade.sh then run.
      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: centry:smoke
          platforms: linux/amd64
          cache-from: type=gha,scope=ci-amd64
          cache-to: type=gha,mode=max,scope=ci-amd64

      - name: Smoke test
        run: scripts/smoke.sh
        env:
          SMOKE_SKIP_BUILD: "1"

      - name: Upgrade and rollback test
        run: scripts/test-upgrade.sh

      - name: Validate the Kafka override
        run: |
          printf 'CENTRY_TAG=ci\nCENTRY_ADMIN_PASSWORD=ci-password-123\n' > .env
          docker compose -f docker-compose.yml -f docker-compose.kafka.yml config -q
